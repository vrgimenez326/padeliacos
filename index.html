<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo de Paletas - MetaPadel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 0;
    }
    header {
      background: #118ab2;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    #filtros {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 15px;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }
    #catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .producto {
      border: 1px solid #ddd;
      padding: 15px;
      text-align: center;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .producto img {
      max-width: 100%;
      border-radius: 6px;
    }
    .precio-origen {
      text-decoration: line-through;
      color: #888;
    }
    .precio-final {
      font-size: 1.2em;
      color: #e63946;
      font-weight: bold;
    }
    .descuento {
      background: #06d6a0;
      color: #fff;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    button {
      background: #118ab2;
      color: #fff;
      border: none;
      padding: 10px 15px;
      margin-top: 10px;
      cursor: pointer;
      border-radius: 5px;
    }
    #comparador {
      padding: 20px;
      background: #fff;
      margin: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
    }
    th {
      background: #118ab2;
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h1>Catálogo de Paletas - MetaPadel</h1>
  </header>

  <div id="filtros">
    <select id="marcaFilter">
      <option value="">Todas las marcas</option>
      <option value="Nox">Nox</option>
      <option value="Adidas">Adidas</option>
      <option value="Bullpadel">Bullpadel</option>
      <option value="Head">Head</option>
      <option value="Babolat">Babolat</option>
      <option value="Wilson">Wilson</option>
    </select>

    <select id="nivelFilter">
      <option value="">Todos los niveles</option>
      <option value="principiante">Principiante</option>
      <option value="intermedio">Intermedio</option>
      <option value="profesional">Profesional</option>
    </select>
  </div>

  <div id="catalogo"></div>
  <div id="comparador"></div>

  <script>
    let seleccionados = [];

    async function cargarCatalogo() {
      const response = await fetch("catalogo.json");
      const productos = await response.json();
      renderizarProductos(productos);

      document.getElementById("marcaFilter").addEventListener("change", () => aplicarFiltros(productos));
      document.getElementById("nivelFilter").addEventListener("change", () => aplicarFiltros(productos));
    }

    function calcularDescuento(precioOrigen, precioFinal) {
      return Math.round(((precioOrigen - precioFinal) / precioOrigen) * 100);
    }

    function renderizarProductos(productos) {
      const contenedor = document.getElementById("catalogo");
      contenedor.innerHTML = "";
      productos.forEach((p, index) => {
        const descuento = calcularDescuento(p.precio_origen, p.precio_final);
        contenedor.innerHTML += `
          <div class="producto">
            <img src="${p.imagen}" alt="${p.nombre}">
            <h3>${p.nombre}</h3>
            <p class="precio-origen">$${p.precio_origen.toLocaleString()}</p>
            <p class="precio-final">$${p.precio_final.toLocaleString()} <span class="descuento">${descuento}% OFF</span></p>
            <button onclick="agregarComparacion(${index})">Comparar</button>
            <button onclick="window.location.href='${p.url}'">Comprar ahora</button>
          </div>
        `;
      });
      window.productos = productos;
    }

    function aplicarFiltros(productos) {
      const marca = document.getElementById("marcaFilter").value;
      const nivel = document.getElementById("nivelFilter").value;

      let filtrados = productos;
      if (marca) filtrados = filtrados.filter(p => p.marca === marca);
      if (nivel) filtrados = filtrados.filter(p => p.nivel === nivel);

      renderizarProductos(filtrados);
    }

    function agregarComparacion(index) {
      const producto = window.productos[index];
      if (seleccionados.length < 2) {
        seleccionados.push(producto);
      }
      if (seleccionados.length === 2) {
        compararProductos(seleccionados[0], seleccionados[1]);
        seleccionados = [];
      }
    }

    function compararProductos(productoA, productoB) {
      const descuentoA = calcularDescuento(productoA.precio_origen, productoA.precio_final);
      const descuentoB = calcularDescuento(productoB.precio_origen, productoB.precio_final);

      const tabla = `
        <h2>Comparación de productos</h2>
        <table>
          <thead>
            <tr>
              <th>Característica</th>
              <th>${productoA.nombre}</th>
              <th>${productoB.nombre}</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>Marca</td><td>${productoA.marca}</td><td>${productoB.marca}</td></tr>
            <tr><td>Tipo de juego</td><td>${productoA.tipo_juego}</td><td>${productoB.tipo_juego}</td></tr>
            <tr><td>Nivel</td><td>${productoA.nivel}</td><td>${productoB.nivel}</td></tr>
            <tr><td>Precio origen</td><td>$${productoA.precio_origen.toLocaleString()}</td><td>$${productoB.precio_origen.toLocaleString()}</td></tr>
            <tr><td>Precio final</td><td>$${productoA.precio_final.toLocaleString()} (${descuentoA}% OFF)</td><td>$${productoB.precio_final.toLocaleString()} (${descuentoB}% OFF)</td></tr>
            <tr><td>Stock</td><td>${productoA.en_stock ? "Disponible" : "Agotado"}</td><td>${productoB.en_stock ? "Disponible" : "Agotado"}</td></tr>
          </tbody>
        </table>
      `;
      document.getElementById("comparador").innerHTML = tabla;
    }

    cargarCatalogo();
  </script>
</body>
</html>
